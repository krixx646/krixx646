<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-label="Bouncing robot">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#f0f6fb"/>
      <stop offset="1" stop-color="#c9d6e9"/>
    </linearGradient>
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- background transparent-friendly -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- path that hits roughly the 4 corners and some midpoints to simulate randomness -->
  <path id="cornerPath" d="M 60 40 
                           L 860 40 
                           L 860 280 
                           L 60 280 
                           L 60 40
                           L 460 160
                           L 860 40
                           L 60 280
                           L 860 280
                           L 460 40
                           L 60 40"
        fill="none" stroke="none"/>

  <!-- robot graphic (grouped) -->
  <g id="robot" transform="translate(0,0)" filter="url(#drop)">
    <!-- simple friendly robot: head -->
    <rect x="-28" y="-72" width="88" height="64" rx="12" fill="#eef7ff" stroke="#91a7bb"/>
    <rect x="-8" y="-56" width="48" height="28" rx="6" fill="#02232a" opacity="0.12"/>
    <circle cx="10" cy="-40" r="6" fill="#7dd3fc">
      <animate attributeName="r" dur="1.8s" values="4;8;4" repeatCount="indefinite"/>
    </circle>
    <circle cx="34" cy="-40" r="6" fill="#7dd3fc">
      <animate attributeName="r" dur="1.8s" begin="0.12s" values="4;8;4" repeatCount="indefinite"/>
    </circle>

    <!-- body -->
    <rect x="-12" y="-8" width="56" height="72" rx="10" fill="url(#g1)" stroke="#9aa8bb"/>
    <!-- arms -->
    <rect x="-56" y="0" width="40" height="12" rx="6" fill="#dbe8f5">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate"
        values="-18  -36 6; 18 -36 6; -18 -36 6" dur="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="52" y="0" width="40" height="12" rx="6" fill="#dbe8f5">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate"
        values="4 76 6; -6 76 6; 4 76 6" dur="1.8s" repeatCount="indefinite"/>
    </rect>

    <!-- legs -->
    <rect x="-6" y="64" width="16" height="28" rx="6" fill="#9aa8bb"/>
    <rect x="18" y="64" width="16" height="28" rx="6" fill="#9aa8bb"/>
  </g>

  <!-- animate the robot group along the corner path -->
  <g>
    <use href="#robot">
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#cornerPath"/>
      </animateMotion>

      <!-- quick scale 'bounce' effect on each corner hit (timed to path progress) -->
      <animateTransform attributeName="transform" attributeType="XML" type="scale"
        values="1;1.06;0.96;1" keyTimes="0;0.25;0.5;1" dur="8s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- caption -->
  <text x="490" y="340" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Agba Valentine Cheluchi — AI assistant in action
  </text>
</svg>
