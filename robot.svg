<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="Humanoid robot working at a desk">
  <defs>
    <linearGradient id="deskGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#e6eef9"/>
      <stop offset="1" stop-color="#c9d6e9"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#0b1220"/>

  <!-- desk -->
  <g transform="translate(40,220)">
    <rect x="0" y="0" width="680" height="80" rx="8" fill="url(#deskGrad)" filter="url(#softShadow)"/>
    <rect x="20" y="-6" width="200" height="10" rx="3" fill="#0f172a"/>
  </g>

  <!-- computer tower (right) -->
  <g transform="translate(570,170)">
    <rect x="0" y="0" width="90" height="92" rx="8" fill="#071029" stroke="#1f2937"/>
    <circle cx="74" cy="74" r="6" fill="#10b981">
      <animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- monitor -->
  <g transform="translate(360,70)">
    <rect x="0" y="0" width="260" height="150" rx="12" fill="#0b1830" stroke="#253244"/>
    <rect x="18" y="14" width="224" height="112" rx="6" fill="#020618"/>
    <!-- screen cycling text: simulated -->
    <text x="130" y="76" font-family="monospace" font-size="14" fill="#7dd3fc" text-anchor="middle">
      <tspan>
        <animate attributeName="opacity" dur="8s" values="1;0;0;1" keyTimes="0;0.25;0.5;1" repeatCount="indefinite">1</animate>
      </tspan>
    </text>
    <g id="screen-lines" fill="#7dd3fc" opacity="0.85">
      <text x="130" y="68" font-family="monospace" font-size="11" text-anchor="middle">
        <tspan>
          <animate attributeName="textLength" dur="9s" from="0" to="220" repeatCount="indefinite" />
        </tspan>
      </text>
      <!-- fallback static line for clients that don't animate -->
      <text x="130" y="90" font-family="monospace" font-size="12" text-anchor="middle">> run: deploy/ai-service</text>
    </g>
  </g>

  <!-- keyboard -->
  <g transform="translate(170,230)">
    <rect x="0" y="0" width="420" height="14" rx="6" fill="#0f172a"/>
    <!-- key press indicator -->
    <rect x="186" y="-8" width="14" height="8" rx="2" fill="#cbd5e1">
      <animate attributeName="y" dur="0.9s" values="-8;-18;-8" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- robot group -->
  <g id="robot" transform="translate(130,60)">
    <!-- shadow -->
    <ellipse cx="140" cy="220" rx="68" ry="16" fill="#000" opacity="0.14"/>

    <!-- body -->
    <rect x="96" y="68" width="88" height="108" rx="12" fill="url(#bodyGrad)" stroke="#9aa8bb" stroke-width="1.5"/>
    <!-- chest detail -->
    <rect x="116" y="86" width="48" height="30" rx="6" fill="#fff" opacity="0.06"/>

    <!-- neck -->
    <rect x="132" y="48" width="24" height="20" rx="4" fill="#9aa8bb"/>

    <!-- head group (tilt animation) -->
    <g id="head" transform="translate(120,16)">
      <g transform="rotate(0)">
        <circle cx="36" cy="24" r="36" fill="#edf6ff" stroke="#9aa8bb"/>
        <!-- eye glow -->
        <ellipse cx="24" cy="20" rx="10" ry="6" fill="url(#eyeGlow)" opacity="0.9"/>
        <!-- eyes (pupils) -->
        <circle cx="24" cy="20" r="3" fill="#071029"/>
        <circle cx="48" cy="20" r="3" fill="#071029"/>
        <!-- mouth - small speaker -->
        <rect x="26" y="34" width="20" height="6" rx="3" fill="#071029" opacity="0.85">
          <animate attributeName="width" dur="2.8s" values="18;26;18" repeatCount="indefinite"/>
        </rect>
      </g>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" values="-6 36 24; 4 36 24; -6 36 24" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- left arm (typing) - smoother rotation -->
    <g id="leftArm" transform="translate(96,108)">
      <rect x="-48" y="-6" width="48" height="14" rx="6" fill="url(#bodyGrad)" stroke="#9aa8bb"/>
      <rect x="-66" y="12" width="36" height="10" rx="5" fill="#94a3b8"/>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" values="-12 0 0; 8 0 0; -12 0 0" dur="1.0s" repeatCount="indefinite"/>
    </g>

    <!-- right arm (resting) -->
    <g id="rightArm" transform="translate(184,110)">
      <rect x="0" y="-6" width="56" height="14" rx="6" fill="url(#bodyGrad)" stroke="#9aa8bb"/>
      <rect x="50" y="14" width="36" height="10" rx="5" fill="#94a3b8"/>
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" values="2 0 0; -4 0 0; 2 0 0" dur="2.4s" repeatCount="indefinite"/>
    </g>

    <!-- legs -->
    <rect x="114" y="176" width="16" height="36" rx="6" fill="#9aa8bb"/>
    <rect x="156" y="176" width="16" height="36" rx="6" fill="#9aa8bb"/>
  </g>

  <!-- small floating UI particles -->
  <g fill="#60a5fa" opacity="0.18">
    <circle cx="30" cy="40" r="3">
      <animate attributeName="cy" dur="7s" values="30;40;30" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="30" r="2.5">
      <animate attributeName="cx" dur="9s" values="700;720;700" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
